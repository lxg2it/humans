name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the floor in package.json engines: it is the first 22.x with
        # type stripping on by default, which is what lets these files run
        # without a build step.
        node: ['22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  container:
    # The tests above drive the service from Node. This drives the container
    # that the deployment actually runs, because the difference between the two
    # is where a deployment breaks: the base image, the documents copied in, the
    # non-root user, the SQLite file on a mount.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/container-smoke.sh
